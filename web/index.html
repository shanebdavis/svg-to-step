<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SVG to STEP</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M1 11l7 4 7-4V5L8 1 1 5z' fill='%232563eb'/%3E%3C/svg%3E">
</head>
<body>
  <div id="root"></div>
  <script>
    // Browsers block module scripts, workers and WebAssembly on file:// pages.
    if (location.protocol === "file:") {
      document.getElementById("root").innerHTML =
        '<div style="font: 15px/1.5 -apple-system, sans-serif; max-width: 560px; margin: 15vh auto; padding: 0 16px">' +
        "<h1 style=\"font-size: 20px\">This page needs to be served over HTTP</h1>" +
        "<p>Browsers don't run web apps opened straight from a file. From the <code>web</code> folder, run " +
        "<code>npm run serve</code> (or <code>npm start</code> for development), or double-click " +
        "<b>Start SVG to STEP (Web).command</b>.</p></div>";
    }
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
